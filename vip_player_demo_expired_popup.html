<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家端 - 禮品收件資訊 (已逾期/彈窗版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #050505;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #E2E8F0;
    }

    .mobile-container {
        width: 100%;
        max-width: 400px;
        background-color: #121212;
        height: 800px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(212, 175, 55, 0.15);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid #27272A;
    }

    .header {
        background-color: #000000;
        color: #FFFFFF;
        padding: 20px;
        text-align: center;
        position: relative;
        z-index: 30;
        border-bottom: 2px solid;
        border-image: linear-gradient(90deg, transparent, #BF953F, #FCF6BA, #BF953F, transparent) 1;
    }
    .header h1 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: 1px;}

    .content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .view-section { display: none; flex-direction: column; flex-grow: 1; height: 100%; overflow: hidden; }
    .view-section.active { display: flex; animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .scroll-container { flex-grow: 1; overflow-y: auto; padding: 30px 20px; }

    h2, h3 { color: #E4CE8A !important; }
    p { color: #9CA3AF !important; }
    strong { color: #FBBF24 !important; }
    i.fa-solid, i.fa-regular { color: #BF953F !important; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #D4AF37 !important; font-size: 14px; letter-spacing: 0.5px;}
    .form-group input {
        width: 100%; padding: 12px;
        background-color: #1A1A1A;
        color: #F8FAFC !important;
        border: 1px solid #3F3F46;
        border-radius: 8px; font-family: inherit; font-size: 16px; transition: 0.3s;
    }
    .form-group input:focus {
        outline: none;
        border-color: #BF953F;
        box-shadow: 0 0 8px rgba(191, 149, 63, 0.4);
    }

    .btn-primary {
        width: 100%; border: none; padding: 14px; border-radius: 8px;
        font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px;
        background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
        color: #000000 !important;
        box-shadow: 0 4px 15px rgba(191, 149, 63, 0.2);
        transition: all 0.3s ease;
    }
    .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(252, 246, 186, 0.4);
    }

    .text-center { text-align: center; }

    /* === 彈跳視窗 (Modal) === */
    .modal-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: none; justify-content: center; align-items: center; z-index: 50;
    }
    .modal {
        background: #18181B; width: 82%; border-radius: 14px; padding: 30px 22px 24px 22px;
        border: 1px solid #F87171; box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(248, 113, 113, 0.1);
        text-align: center;
    }
    .modal-icon-wrap {
        width: 78px; height: 78px; border-radius: 50%;
        background: rgba(248, 113, 113, 0.08);
        border: 1px solid rgba(248, 113, 113, 0.4);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 18px auto;
    }
    .modal-icon-wrap i { color: #F87171 !important; font-size: 32px; }
    .modal h3 { margin: 0 0 12px 0; font-size: 17px; color: #E4CE8A !important; }
    .modal p { font-size: 14px; color: #D4D4D8 !important; line-height: 1.8; margin: 0 0 22px 0; }
    .modal .deadline { color: #F87171 !important; font-weight: 700; }
    .modal .cs-name { color: #FBBF24 !important; font-weight: 700; }
    .modal .btn-primary { margin-top: 0; }
    .modal .btn-secondary-outline {
        background: transparent; color: #D4AF37 !important; border: 1px solid #BF953F;
        width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500;
        cursor: pointer; margin-top: 10px; transition: 0.3s;
        display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .modal .btn-secondary-outline:hover { background: rgba(191, 149, 63, 0.1); }

    * { scrollbar-width: thin; scrollbar-color: #BF953F #121212; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #121212; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #BF953F; border-radius: 10px; border: 2px solid #121212; }
    ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="header">
        <h1>VIP 專屬禮品登記</h1>
    </div>

    <div class="content">
        <!-- View 1: 身分驗證 -->
        <div id="view-auth" class="view-section active">
            <div class="scroll-container">
                <div class="text-center" style="margin-bottom: 30px;">
                    <i class="fa-solid fa-shield-halved" style="font-size: 48px; color: #3b82f6; margin-bottom: 15px;"></i>
                    <h2 style="margin: 0; color: #1e293b; font-size: 20px;">身分驗證</h2>
                    <p style="color: #64748b; font-size: 14px;">為了保障您的權益，請輸入您的遊戲暱稱與綁定的手機門號進行驗證。</p>
                </div>

                <div class="form-group">
                    <label>遊戲暱稱</label>
                    <input type="text" placeholder="請輸入您的遊戲暱稱" id="nicknameInput">
                </div>

                <div class="form-group">
                    <label>綁定手機門號</label>
                    <input type="tel" placeholder="09xxxxxxxx" id="phoneInput">
                </div>

                <!-- 逾期且未曾留存/無意願情境：驗證後跳出彈窗阻擋，不進入任何後續頁面 -->
                <button class="btn-primary" onclick="showExpiredModal()">驗證並繼續</button>
                <p style="text-align: center; font-size: 12px; color: #94a3b8; margin-top: 20px;">錯誤達 3 次將暫停驗證 15 分鐘</p>
            </div>
        </div>
    </div>

    <!-- Expired Modal (已逾期阻擋提示) -->
    <div class="modal-overlay" id="expiredModal">
        <div class="modal">
            <div class="modal-icon-wrap">
                <i class="fa-solid fa-ban"></i>
            </div>
            <h3>活動已截止</h3>
            <p>您好，由於本次禮品領取時間已於 <span class="deadline">2026/07/30</span> 截止，若您有任何問題，請您可以聯繫「<span class="cs-name">包你發</span>」線上客服為您服務，謝謝。</p>
            <button class="btn-secondary-outline" onclick="return false;">
                <i class="fa-brands fa-line" style="color:#D4AF37 !important;"></i> 聯繫線上客服
            </button>
        </div>
    </div>
</div>

<script>
    function showExpiredModal() {
        document.getElementById('expiredModal').style.display = 'flex';
    }
</script>
</body>
</html>
