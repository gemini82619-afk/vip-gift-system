<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家端 - 禮品收件資訊 (非活動期間)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #050505;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #E2E8F0;
    }

    .mobile-container {
        width: 100%;
        max-width: 400px;
        background-color: #121212;
        height: 800px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(212, 175, 55, 0.15);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid #27272A;
    }

    .header {
        background-color: #000000;
        color: #FFFFFF;
        padding: 20px;
        text-align: center;
        position: relative;
        z-index: 30;
        border-bottom: 2px solid;
        border-image: linear-gradient(90deg, transparent, #BF953F, #FCF6BA, #BF953F, transparent) 1;
    }
    .header h1 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: 1px; color: #E4CE8A; }

    .content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* === 首頁：無登入表單，僅顯示非活動期間的靜態畫面 === */
    .closed-view {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 30px;
    }
    .closed-icon-wrap {
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 20px;
    }
    .closed-icon-wrap svg { fill: #E4CE8A; width: 56px; height: 56px; }
    .closed-view h2 { margin: 0 0 10px 0; font-size: 19px; color: #E4CE8A !important; }
    .closed-view p { margin: 0; font-size: 14px; color: #9CA3AF !important; line-height: 1.8; }

    .svg-icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; fill: currentColor; }

    * { scrollbar-width: thin; scrollbar-color: #52525B #121212; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #121212; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #52525B; border-radius: 10px; border: 2px solid #121212; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="header">
        <h1>VIP 專屬禮品登記</h1>
    </div>

    <div class="content">
        <!-- 首頁：活動已結束超過一個月，取消登入表單，直接顯示提示訊息（不使用彈窗） -->
        <div class="closed-view">
            <div class="closed-icon-wrap">
                <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
            </div>
            <h2>目前非活動登陸時間！</h2>
            
        </div>
    </div>
</div>

</body>
</html>
